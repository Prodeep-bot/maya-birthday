<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Mayaa ♡</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for Romantic Vibe -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Music Control Button -->
    <button id="music-btn" class="hidden">🎵 Play Music</button>

    <!-- Intro Screen -->
    <div id="intro-screen" class="screen">
        <div class="content">
            <h1>Hey, Mayaa… ♡</h1>
            <p>Before you scroll any further,<br>just know that I made this thinking about you.</p>
            <p>Every little part has a reason.</p>
            <h2>Shall we? ♡</h2>
            <div class="buttons">
                <button id="yes-btn">YES ♡</button>
                <button id="no-btn">no</button>
            </div>
        </div>
    </div>

    <!-- Gallery Screen (Hidden Initially) -->
    <div id="gallery-screen" class="screen hidden">
        <div class="gallery-content">
            <h1 class="gallery-title">Our Beautiful Journey ♡</h1>
            
            <!-- Photo Grid -->
            <div class="photo-grid">
                <img src="mm.jpeg" alt="Memory 1" class="photo">
                <img src="aa.jpeg" alt="Memory 2" class="photo">
                <img src="dddd.jpeg" alt="Memory 3" class="photo">
                <img src="dv.jpeg" alt="Memory 4" class="photo">
                <img src="qq.jpeg" alt="Memory 5" class="photo">
                <img src="WhatsApp Image 2026-09-29 at 6.45.16 PM.jpeg" alt="Memory 6" class="photo">
                
                <img src="ww.jpeg" alt="Memory 7" class="photo">
                <img src="xx.jpeg" alt="Memory 8" class="photo">
                <img src="WhatsApp Image 2026-09-29 at 6.50.03 PM.jpeg" alt="Memory 9" class="photo">
                <img src="WhatsApp Image 2026-09-29 at 6.50.16 PM.jpeg" alt="Memory 10" class="photo">
                <video src="WhatsApp Video 2026-09-29 at 6.39.18 PM.mp4" alt="Memory 11" class="photo">
                    <img src="zz.jpeg" alt="Memory 7" class="photo">
            </div>

            <!-- The Special Yellow Paper Note -->
            <div class="final-note-container">
                <p class="note-text">And finally, this is straight from my heart...</p>
                <div class="yellow-note-wrapper">
                    <img src="WhatsApp Image 2026-09-29 at 6.45.26 PM.jpeg" alt="Handwritten Note" class="yellow-note">
                </div>
                <p class="ending-text">Happy Birthday, My Love! 🎂❤️</p>
            </div>
        </div>
    </div>

    <!-- Background Music -->
    <audio id="bg-music" loop>
        <source src="Navjot Ahuja - Khat (Official Audio) - Navjot Ahuja (128k).mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</html>
